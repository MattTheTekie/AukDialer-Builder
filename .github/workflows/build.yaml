name: Sync upstream, build APK, and release

on:
  workflow_dispatch:
  schedule:
    # Every day at 03:20 UTC.
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-build-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Victor-root/AukDialer

  # Adjust these if required by the project's Gradle configuration.
  JAVA_VERSION: "17"
  BUILD_TASK: assembleDebug

jobs:
  sync-build-release:
    # Run only in a fork, not in the upstream repository.
    if: github.repository != 'Victor-root/AukDialer'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the fork's default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM_BRANCH="$(
            gh api "repos/${UPSTREAM_REPOSITORY}" --jq '.default_branch'
          )"

          git remote add upstream \
            "https://github.com/${UPSTREAM_REPOSITORY}.git"

          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          BEFORE="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"

          if ! git merge --no-edit "${UPSTREAM_SHA}"; then
            git merge --abort || true
            echo "::error::Upstream merge conflict. Resolve it manually in your fork."
            exit 1
          fi

          AFTER="$(git rev-parse HEAD)"

          if [[ "${BEFORE}" != "${AFTER}" ]]; then
            git push origin "HEAD:${FORK_BRANCH}"
          fi

          TAG="upstream-${UPSTREAM_SHA:0:12}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_sha=${AFTER}" >> "${GITHUB_OUTPUT}"

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs always build.
          # Scheduled runs skip upstream commits already released.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          elif gh release view "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Java
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        if: steps.decide.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          # Do not request the removed legacy "tools" package.
          packages: 'platform-tools'

      - name: Set up Gradle
        if: steps.decide.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Restore persistent debug signing key
        if: steps.decide.outputs.build == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.android"

          if [[ -n "${DEBUG_KEYSTORE_BASE64}" ]]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" \
              | base64 --decode > "${HOME}/.android/debug.keystore"

            chmod 600 "${HOME}/.android/debug.keystore"
          else
            echo "::warning::No persistent debug keystore configured. APKs from different runs may not update over each other."
          fi

      - name: Build APK
        if: steps.decide.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f gradlew ]]; then
            echo "::error::No Gradle wrapper found at the repository root."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon "${BUILD_TASK}"

      - name: Collect APKs and checksums
        if: steps.decide.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets

          while IFS= read -r -d '' APK; do
            # Include module and variant paths to avoid duplicate names.
            NAME="${APK#./}"
            NAME="${NAME//\//-}"

            cp "${APK}" "release-assets/${NAME}"
          done < <(
            find . -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk' \
              -print0
          )

          shopt -s nullglob
          APKS=(release-assets/*.apk)

          if (( ${#APKS[@]} == 0 )); then
            echo "::error::Build completed, but no APK files were found."
            exit 1
          fi

          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.sync.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          BUILD_SHA: ${{ steps.sync.outputs.build_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Automated APK build from this fork after merging upstream.

          - Upstream repository: ${UPSTREAM_REPOSITORY}
          - Upstream commit: ${UPSTREAM_SHA}
          - Fork build commit: ${BUILD_SHA}
          - Gradle task: ${BUILD_TASK}
          - Signing: debug, not production release signing

          These APKs are development builds.
          EOF

          if gh release view "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${BUILD_SHA}" \
              --title "AukDialer ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          fi